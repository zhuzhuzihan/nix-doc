name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable

      - name: Checkout upstream Nix
        run: |
          git clone --filter=blob:none https://github.com/NixOS/nix.git ../nix-upstream
          # 锁定 2026-11-09 构建成功的 master 版本（上游 11-10 引入 main.cc #embed narrowing 编译回归，修复后可更新此处）
          git -C ../nix-upstream checkout 57d11f741d14

      - name: Overlay translated manual
        run: |
          rm -rf ../nix-upstream/doc/manual
          cp -r manual ../nix-upstream/doc/manual
          # 中文 store types 文档经 #embed 进入 nix-cli 的 char 数组，
          # g++ 对 int->char narrowing 报错；-Wno-narrowing 下字节值无损（UTF-8 输出正常）
          sed -i 's|^  pname = "nix";$|  pname = "nix";\n\n  env.NIX_CFLAGS_COMPILE = "-Wno-narrowing";|' ../nix-upstream/src/nix/package.nix
          grep -A1 'pname = "nix"' ../nix-upstream/src/nix/package.nix
          cd ../nix-upstream
          git add -A
          git -c user.email=ci@local -c user.name=ci commit -m "overlay zh manual" --no-verify || true

      - name: Build manual
        run: nix build ../nix-upstream#nix-manual^out --out-link result

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: result/share/doc/nix/manual

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
